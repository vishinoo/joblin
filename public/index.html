<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Joblin</title>
<link rel="icon" href="/img/joblin-logo-64.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/app.css">
</head>
<body>
<div class="shell">
  <aside class="side">
    <div class="brand"><img class="mark" src="/img/joblin-logo-64.png" alt="" aria-hidden="true">Joblin</div>
    <nav id="nav">
      <div class="group">Overview</div>
      <a href="#/dashboard" data-route="dashboard"><svg viewBox="0 0 20 20"><path d="M3 3h6v6H3zM11 3h6v4h-6zM11 9h6v8h-6zM3 11h6v6H3z"/></svg>Dashboard</a>
      <a href="#/review" data-route="review"><svg viewBox="0 0 20 20"><path d="M4 4h12v12H4z"/><path d="M7 10l2 2 4-4"/></svg>Review batch<span class="badge" id="reviewBadge" hidden></span></a>
      <div class="group">Pipeline</div>
      <a href="#/applications" data-route="applications"><svg viewBox="0 0 20 20"><path d="M4 5h12M4 10h12M4 15h8"/></svg>Applications</a>
      <a href="#/outreach" data-route="outreach"><svg viewBox="0 0 20 20"><path d="M3 5h14v10H3z"/><path d="M3 5l7 6 7-6"/></svg>Outreach</a>
      <a href="#/tasks" data-route="tasks"><svg viewBox="0 0 20 20"><path d="M5 5h10M5 10h10M5 15h6"/><circle cx="2.5" cy="5" r=".6"/></svg>Tasks<span class="badge quiet" id="taskBadge" hidden></span></a>
      <a href="#/answers" data-route="answers"><svg viewBox="0 0 20 20"><path d="M4 4h12v9H9l-4 3v-3H4z"/></svg>Questions<span class="badge" id="qBadge" hidden></span></a>
      <a href="#/memory" data-route="memory"><svg viewBox="0 0 20 20"><path d="M10 3.5c-3 0-5 2-5 4.6 0 1.6.8 2.7 1.8 3.5V14h6.4v-2.4c1-.8 1.8-1.9 1.8-3.5 0-2.6-2-4.6-5-4.6z"/><path d="M8 16.5h4"/></svg>Memory</a>
      <div class="group">Account</div>
      <a href="#/settings" data-route="settings"><svg viewBox="0 0 20 20"><circle cx="10" cy="10" r="2.6"/><path d="M10 2.5v2.2M10 15.3v2.2M2.5 10h2.2M15.3 10h2.2M4.7 4.7l1.6 1.6M13.7 13.7l1.6 1.6M4.7 15.3l1.6-1.6M13.7 6.3l1.6-1.6"/></svg>Settings</a>
    </nav>
    <div class="side-foot" id="sideFoot"></div>
  </aside>

  <main class="main">
    <header class="top">
      <h1 id="pageTitle">Dashboard</h1>
      <div class="top-right">
        <div class="worker" id="worker"></div>
        <button class="btn primary" id="runBtn">Find jobs now</button>
      </div>
    </header>
    <div id="view" class="view"></div>
  </main>
</div>

<div id="onboarding" class="ob" hidden></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<script src="/app.js" type="module"></script>
</body>
</html>
